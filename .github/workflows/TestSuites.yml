name: Test suites

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suites:
    name: Smoke, unit, application, and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run smoke tests
        run: uv run pytest -q tests/smoke

      - name: Run unit tests
        run: uv run pytest -q tests/interchange tests/Policy tests/steering

      - name: Run application tests
        run: uv run pytest -q tests/convert/api tests/convert/runtime

      - name: Run integration tests without CAD applications
        env:
          KIT_FREECAD_ORACLE: ""
          KIT_SOLIDWORKS_ORACLE: ""
        run: uv run pytest -q tests/convert
