name: SPDX header guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  verify-headers:
    name: Verify SPDX headers are intact
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
      result: ${{ steps.verify.outcome }}
      remediation_attempted: ${{ steps.remediation-state.outputs.cache-hit == 'true' }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Determine base and head for comparison
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            base="$PULL_REQUEST_BASE_SHA"
            head="$PULL_REQUEST_HEAD_SHA"
          else
            base="$PUSH_BASE_SHA"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            head="$PUSH_HEAD_SHA"
          fi
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi
          git fetch origin "$base" --depth=1
          git fetch origin "$head" --depth=1
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Materialize changed files as data
        id: source
        env:
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          source="$RUNNER_TEMP/spdx-header-source"
          git worktree add --detach "$source" "$HEAD_SHA"
          echo "path=$source" >> "$GITHUB_OUTPUT"

      - name: Restore remediation state
        id: remediation-state
        if: github.event_name == 'pull_request_target'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/spdx-header-remediation
          key: spdx-header-remediation-v1-${{ github.repository_id }}-${{ github.event.pull_request.number }}

      - name: Verify headers (base -> head, hash comparison)
        id: verify
        continue-on-error: true
        run: |
          python3 .github/scripts/verify_spdx_headers.py \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}" \
            --worktree "${{ steps.source.outputs.path }}"

  remediate-missing-headers:
    name: Remediate missing SPDX headers
    needs: verify-headers
    if: >-
      needs.verify-headers.outputs.result == 'failure' &&
      needs.verify-headers.outputs.remediation_attempted != 'true' &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Materialize pull request files as data
        id: source
        env:
          BASE_SHA: ${{ needs.verify-headers.outputs.base }}
          HEAD_SHA: ${{ needs.verify-headers.outputs.head }}
        run: |
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi
          git fetch origin "$BASE_SHA" --depth=1
          git fetch origin "$HEAD_SHA" --depth=1
          source="$RUNNER_TEMP/spdx-header-source"
          git worktree add --detach "$source" "$HEAD_SHA"
          echo "path=$source" >> "$GITHUB_OUTPUT"

      - name: Add absent headers
        run: |
          python3 .github/scripts/verify_spdx_headers.py \
            --base "${{ needs.verify-headers.outputs.base }}" \
            --head "${{ needs.verify-headers.outputs.head }}" \
            --worktree "${{ steps.source.outputs.path }}" \
            --fix-missing
          python3 .github/scripts/verify_spdx_headers.py \
            --base "${{ needs.verify-headers.outputs.base }}" \
            --head "${{ needs.verify-headers.outputs.head }}" \
            --worktree "${{ steps.source.outputs.path }}"

      - name: Commit repaired headers
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SOURCE_ROOT: ${{ steps.source.outputs.path }}
        run: |
          git -C "$SOURCE_ROOT" diff --check
          if git -C "$SOURCE_ROOT" diff --quiet; then
            exit 1
          fi
          git -C "$SOURCE_ROOT" config user.name "github-actions[bot]"
          git -C "$SOURCE_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$SOURCE_ROOT" add --all
          git -C "$SOURCE_ROOT" commit -m "chore: restore SPDX headers"
          git -C "$SOURCE_ROOT" push origin "HEAD:${HEAD_REF}"
          echo "head=$(git -C "$SOURCE_ROOT" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify committed repair
        env:
          BASE_SHA: ${{ needs.verify-headers.outputs.base }}
          HEAD_SHA: ${{ steps.commit.outputs.head }}
          SOURCE_ROOT: ${{ steps.source.outputs.path }}
        run: |
          python3 .github/scripts/verify_spdx_headers.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --worktree "$SOURCE_ROOT"

      - name: Persist remediation attempt
        run: |
          mkdir -p "$RUNNER_TEMP/spdx-header-remediation"
          printf '%s\n' "${{ steps.commit.outputs.head }}" > "$RUNNER_TEMP/spdx-header-remediation/attempt"

      - name: Save remediation state
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/spdx-header-remediation
          key: spdx-header-remediation-v1-${{ github.repository_id }}-${{ github.event.pull_request.number }}

  reject-header-failure:
    name: Reject unresolved SPDX header failure
    needs: [verify-headers, remediate-missing-headers]
    if: >-
      always() &&
      needs.verify-headers.outputs.result == 'failure' &&
      needs.remediate-missing-headers.result != 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Explain failure
        run: |
          echo "::error::One or more changed files are missing the required SPDX header, or it was edited, truncated, reordered, or moved. The automatic PR-only remediation has already been attempted or could not safely add a completely absent header. See HEADER_NOTICE and .kiro/steering/spdx-header.md. Pushes to main are never remediated automatically."
          exit 1
