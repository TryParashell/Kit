name: SPDX header guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-headers:
    name: Verify SPDX headers are intact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine base and head for comparison
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify headers (base -> head, hash comparison)
        run: |
          python3 .github/scripts/verify_spdx_headers.py \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}"

      - name: Explain failure
        if: failure()
        run: |
          echo "::error::One or more changed files are missing the required SPDX header, or it was edited, truncated, reordered, or moved. See HEADER_NOTICE and .kiro/steering/spdx-header.md. This check blocks the pull request / push until every in-scope changed file carries the exact, unmodified header at the top of the file."
