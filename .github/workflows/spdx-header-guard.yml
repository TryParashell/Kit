name: SPDX header guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for the verification comparison
        required: true
        type: string
      head_sha:
        description: Head commit for the verification comparison
        required: true
        type: string
      pull_request_number:
        description: Pull request number whose remediation state is being checked
        required: true
        type: string

jobs:
  verify-headers:
    name: Verify SPDX headers are intact
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
      result: ${{ steps.verify.outcome }}
      remediation_attempted: ${{ steps.remediation-state.outputs.cache-hit == 'true' }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Determine base and head for comparison
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch origin "${{ inputs.base_sha }}" --depth=1
            git fetch origin "${{ inputs.head_sha }}" --depth=1
            echo "base=${{ inputs.base_sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ inputs.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore remediation state
        id: remediation-state
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/spdx-header-remediation
          key: spdx-header-remediation-v1-${{ github.repository_id }}-${{ github.event.pull_request.number || inputs.pull_request_number }}

      - name: Verify headers (base -> head, hash comparison)
        id: verify
        continue-on-error: true
        run: |
          python3 .github/scripts/verify_spdx_headers.py \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}"

  remediate-missing-headers:
    name: Remediate missing SPDX headers
    needs: verify-headers
    if: >-
      needs.verify-headers.outputs.result == 'failure' &&
      needs.verify-headers.outputs.remediation_attempted != 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Add absent headers
        run: |
          python3 .github/scripts/verify_spdx_headers.py \
            --base "${{ needs.verify-headers.outputs.base }}" \
            --head "${{ needs.verify-headers.outputs.head }}" \
            --fix-missing
          python3 .github/scripts/verify_spdx_headers.py \
            --base "${{ needs.verify-headers.outputs.base }}" \
            --head "${{ needs.verify-headers.outputs.head }}"

      - name: Commit repaired headers
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git diff --check
          if git diff --quiet; then
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: restore SPDX headers"
          git push origin "HEAD:${HEAD_REF}"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Persist remediation attempt
        run: |
          mkdir -p "$RUNNER_TEMP/spdx-header-remediation"
          printf '%s\n' "${{ steps.commit.outputs.head }}" > "$RUNNER_TEMP/spdx-header-remediation/attempt"

      - name: Save remediation state
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/spdx-header-remediation
          key: spdx-header-remediation-v1-${{ github.repository_id }}-${{ github.event.pull_request.number }}

      - name: Dispatch follow-up verification
        env:
          BASE_SHA: ${{ needs.verify-headers.outputs.base }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ steps.commit.outputs.head }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 -c 'import json, os; print(json.dumps({"ref": os.environ["HEAD_REF"], "inputs": {"base_sha": os.environ["BASE_SHA"], "head_sha": os.environ["HEAD_SHA"], "pull_request_number": os.environ["PR_NUMBER"]}}))' > "$RUNNER_TEMP/spdx-header-dispatch.json"
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @"$RUNNER_TEMP/spdx-header-dispatch.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/spdx-header-guard.yml/dispatches"

  reject-header-failure:
    name: Reject unresolved SPDX header failure
    needs: [verify-headers, remediate-missing-headers]
    if: >-
      always() &&
      needs.verify-headers.outputs.result == 'failure' &&
      needs.remediate-missing-headers.result != 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Explain failure
        run: |
          echo "::error::One or more changed files are missing the required SPDX header, or it was edited, truncated, reordered, or moved. The automatic PR-only remediation has already been attempted or could not safely add a completely absent header. See HEADER_NOTICE and .kiro/steering/spdx-header.md. Pushes to main are never remediated automatically."
          exit 1
