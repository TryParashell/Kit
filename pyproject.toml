[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kit"
version = "0.1.0"
description = "Vendor agnostic CAD interchange."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Parashell, Inc." }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.entry-points."kit"]
sdk = "convert"

[tool.hatch.build.targets.wheel]
packages = ["src/interchange", "src/convert"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
