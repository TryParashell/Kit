[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "parakit"
version = "0.1.0"
description = "Vendor agnostic CAD interchange."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Parashell, Inc." }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
parakit = "parakit.cli:main"

[project.entry-points."cadbridge.adapters"]
cadjson = "cadbridge.adapters.cadjson:CadJsonAdapter"
freecad = "cadbridge.adapters.freecad:FreeCADAdapter"
sldprt = "cadbridge.adapters.sldprt:SldprtAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/cadbridge", "src/parakit"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
