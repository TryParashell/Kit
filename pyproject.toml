[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "kit"
version = "0.1.0"
description = "CAD interchange SDK by Parashell."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Parashell, Inc." },
    { name = "Odin Glynn-Martin", email = "odin.glynn@parashell.cloud" },
]
maintainers = [
    { name = "Odin Glynn-Martin", email = "odin.glynn@parashell.cloud" },
]
keywords = ["cad"]
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = []

[project.urls]
Repository = "https://github.com/TryParashell/Kit"
Issues = "https://github.com/TryParashell/Kit/issues"

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.entry-points."kit"]
convert = "convert:convert"

[tool.hatch.build.targets.wheel]
packages = ["src/interchange", "src/convert"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
